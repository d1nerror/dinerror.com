<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Struggle!, Dinos Kapsalas</title>
<meta name="description" content="The Struggle!, an endless 8-bit side-scrolling shooter by Dinos Kapsalas.">
<meta property="og:title" content="The Struggle!, Dinos Kapsalas">
<meta property="og:description" content="An endless 8-bit side-scrolling shooter by Dinos Kapsalas.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0E120F">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23253027'/%3E%3Cg fill='%238DEF86'%3E%3Cpath d='M4 9h8v1h1v8h-1v1H4zM8 12v4h3v-4z'/%3E%3Cpath d='M16 9h2v10h-2zM23 9h3v3h-3zM20 12h3v4h-3zM23 16h3v3h-3z'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: handheld console, screen on top, control deck below; scales to viewport. Single-theme by design. */
:root{
  --color-shade:#253027;--color-ink:#378F46;--color-mid:#8CBF6A;--color-screen:#D4E8B4;
  --color-body:#1C231D;--color-body-dark:#0E120F;--color-btn:#3A4A3D;--color-label:#B8CFA6;
  --font-pixel:"Press Start 2P",ui-monospace,"Courier New",monospace;
  --space-sm:8px;--space-md:16px;--space-lg:24px;
  --back-h:44px;
  --ar:1.7778; /* game screen width / height, set by the script */
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--color-body-dark);color:var(--color-shade);font-family:var(--font-pixel);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-sm);
  padding:max(var(--space-sm),env(safe-area-inset-top)) var(--space-md) max(var(--space-sm),env(safe-area-inset-bottom));
  overflow:hidden;-webkit-tap-highlight-color:transparent}
/* Back to the portfolio: sits above the console, aligned to its left edge */
.back{align-self:center;width:min(100%,calc((100dvh - 60px - var(--back-h)) * var(--ar)),1000px);display:flex}
.back a{display:inline-flex;align-items:center;gap:var(--space-sm);min-height:var(--back-h);padding-inline:4px;
  font-size:10px;letter-spacing:1px;color:var(--color-label);text-decoration:none;transition:color 150ms ease-out}
.back a:focus-visible{outline:3px dashed var(--color-label);outline-offset:2px}
@media (hover:hover){.back a:hover{color:var(--color-screen)}}
.back svg{width:12px;height:12px;flex-shrink:0}
.console{width:min(100%,calc((100dvh - 60px - var(--back-h)) * var(--ar)),1000px);min-width:min(100%,280px);display:grid;gap:var(--space-md);
  background:var(--color-body);padding:var(--space-md);border-radius:12px 12px 40px 12px;box-shadow:inset -4px -4px 0 var(--color-body-dark)}
.screen{position:relative;aspect-ratio:var(--ar);max-width:100%;container-type:inline-size;background:var(--color-screen);border-radius:4px;
  box-shadow:0 0 0 6px var(--color-shade);overflow:hidden;touch-action:none}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.overlay{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:clamp(6px,3cqi,16px);
  text-align:center;background:var(--color-screen);padding:var(--space-sm)}
[hidden]{display:none!important}
h1{margin:0;font-size:clamp(14px,6.5cqi,40px);letter-spacing:2px;text-shadow:3px 3px 0 var(--color-ink)}
h2{margin:0;font-size:clamp(12px,5cqi,26px)}
.controls{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:clamp(8px,3.2cqi,12px);line-height:1.6;text-align:left}
.controls b{color:var(--color-ink)}
p{margin:0;font-size:clamp(8px,3cqi,12px);line-height:1.6}
.btn{font:inherit;font-size:clamp(10px,3.6cqi,14px);background:var(--color-shade);color:var(--color-screen);
  border:0;padding:10px 18px;cursor:pointer;box-shadow:4px 4px 0 var(--color-ink)}
.btn:hover{background:var(--color-ink);box-shadow:4px 4px 0 var(--color-shade)}
.btn:active{transform:translate(4px,4px);box-shadow:none}
.btn:focus-visible,.pad button:focus-visible{outline:3px dashed var(--color-shade);outline-offset:4px}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
/* control deck */
.deck{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"dpad . ab" "sys sys sys";align-items:center;gap:var(--space-md);
  user-select:none;-webkit-user-select:none;touch-action:none}
.pad button{font:inherit;border:0;cursor:pointer;touch-action:none;color:var(--color-screen)}
.dpad{grid-area:dpad;display:grid;grid-template-columns:repeat(3,var(--d));grid-template-rows:repeat(3,var(--d));--d:44px}
.dpad button{background:var(--color-btn);font-size:10px}
.dpad .up{grid-area:1/2}.dpad .left{grid-area:2/1;border-radius:4px 0 0 4px}.dpad .right{grid-area:2/3;border-radius:0 4px 4px 0}
.dpad .down{grid-area:3/2}.dpad .up{border-radius:4px 4px 0 0}.dpad .down{border-radius:0 0 4px 4px}
.dpad .mid{grid-area:2/2;background:var(--color-btn)}
.ab{grid-area:ab;display:flex}
.ab button{width:60px;aspect-ratio:1;border-radius:50%;background:var(--color-ink);color:var(--color-screen);
  font-size:clamp(12px,3vw,16px);box-shadow:0 4px 0 var(--color-shade)}
.sys{grid-area:sys;display:flex;justify-content:center;gap:var(--space-lg)}
.sys label{display:grid;justify-items:center;gap:4px;font-size:9px;color:var(--color-label);letter-spacing:1px}
.sys button{position:relative;width:64px;height:44px;background:transparent}
.sys button::before{content:"";position:absolute;left:6px;right:6px;top:15px;height:14px;border-radius:7px;background:var(--color-btn);box-shadow:inset 0 -3px 0 var(--color-body-dark)}
.pad button.on,.pad button:active{filter:brightness(1.5);transform:translateY(2px)}
.deck{display:none;padding:var(--space-sm) var(--space-md) var(--space-md)}
@media (max-width:820px),(hover:none) and (pointer:coarse){
  .deck{display:grid}
  .console,.back{width:min(100%,calc((100dvh - 300px - var(--back-h)) * var(--ar)),640px)}
}
@media (min-width:560px) and (max-width:820px){.deck{grid-template-areas:"dpad sys ab"}.sys{align-self:end}}
/* phone on its side: pads either side of the screen instead of below it */
@media (orientation:landscape) and (max-height:500px) and (hover:none) and (pointer:coarse){
  body{gap:4px}
  .console,.back{width:min(100%,calc((100dvh - var(--back-h) - 48px) * var(--ar) + 300px))}
  .console{grid-template-columns:auto 1fr auto;grid-template-areas:"dpad screen ab" "exit screen start";align-items:center;column-gap:var(--space-lg)}
  .screen{grid-area:screen}
  .deck,.sys{display:contents}
  .sys label:first-child{grid-area:exit}.sys label:last-child{grid-area:start}
}
@media (prefers-reduced-motion:reduce){.blink{animation:none}.back a{transition:none}}
</style>
</head>
<body>

<nav class="back" aria-label="Site">
  <a href="index.html"><svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M2 5h10v2H2zM4 3h2v2H4zM4 7h2v2H4zM6 1h2v2H6zM6 9h2v2H6z"/></svg>Back to portfolio</a>
</nav>

<main class="console">
  <div class="screen" id="screen">
    <canvas id="game" width="384" height="216" aria-label="The Struggle game screen"></canvas>

    <section class="overlay" id="start">
      <h1>THE STRUGGLE!</h1>
      <ul class="controls">
        <li><b>ARROWS</b> move</li>
        <li><b>SPACE</b> shoot</li>
        <li><b>HOLD SPACE</b> fireball</li>
        <li><b>P</b> pause &nbsp;<b>ESC</b> exit</li>
      </ul>
      <p>Survive.</p>
      <button class="btn" id="startBtn" type="button">START</button>
      <p id="bestStart"></p>
    </section>

    <section class="overlay" id="over" hidden>
      <h2>GAME OVER</h2>
      <p id="finalScore"></p>
      <button class="btn" id="againBtn" type="button">PLAY AGAIN</button>
    </section>

    <section class="overlay" id="paused" hidden style="background:rgba(212,232,180,.85)">
      <h2 class="blink">PAUSED</h2>
      <p id="pauseHint">Press P</p>
    </section>
  </div>

  <div class="deck pad">
    <div class="dpad" role="group" aria-label="Direction pad">
      <button class="up" data-key="ArrowUp" aria-label="Up" type="button">▲</button>
      <button class="left" data-key="ArrowLeft" aria-label="Left" type="button">◀</button>
      <span class="mid"></span>
      <button class="right" data-key="ArrowRight" aria-label="Right" type="button">▶</button>
      <button class="down" data-key="ArrowDown" aria-label="Down" type="button">▼</button>
    </div>
    <div class="ab">
      <button class="a" data-key="KeyJ" type="button" aria-label="A, shoot, hold to charge">A</button>
    </div>
    <div class="sys">
      <label>EXIT<button id="btnExit" type="button" aria-label="Exit to title"></button></label>
      <label>START<button id="btnStart" type="button" aria-label="Start or pause"></button></label>
    </div>
  </div>
</main>

<script>
(()=>{
const DARK="#253027",GREEN="#378F46",MID="#8CBF6A",BG="#D4E8B4";
const PX=1/3; // sprites are 48 units with 3-unit pixels → 16 game px
// Logical screen: wide on desktop; on phones a smaller field so everything is drawn bigger.
let W=384,H=216;const TOP=36; // HUD height; play area starts below it
const TOUCH=matchMedia("(max-width:820px),(hover:none) and (pointer:coarse)");
const S={
 ship:[[15,6,18,3,0],[12,9,3,3,0],[33,9,3,3,0],[9,12,3,24,0],[24,12,3,18,1],[36,12,3,24,0],[21,18,3,12,1],[27,18,6,3,1],[18,21,3,9,1],[27,21,3,9,1],[30,21,3,3,0],[15,24,3,6,1],[30,24,3,6,1],[6,30,3,6,0],[12,30,24,9,0],[39,30,3,6,0],[42,30,3,6,1]],
 e1:[[27,15,3,6,0],[21,18,6,3,0],[15,21,3,6,0],[18,21,6,3,1],[24,21,3,9,0],[18,24,6,3,0],[21,27,3,3,0],[27,27,3,6,0]],
 e2:[[27,9,6,3,0],[24,12,6,9,0],[15,15,6,6,0],[9,18,3,3,1],[12,18,3,3,0],[21,18,3,12,0],[15,21,3,6,1],[18,21,3,12,0],[9,27,3,3,1],[12,27,6,3,0],[24,27,6,9,0],[15,30,3,3,0],[27,36,6,3,0]],
 e3:[[21,9,12,3,0],[21,12,3,12,0],[30,12,3,24,0],[12,15,9,6,0],[24,15,6,6,0],[33,15,3,18,0],[36,18,3,3,0],[15,21,3,3,0],[27,21,3,15,0],[18,27,3,9,0],[36,27,3,3,0],[12,30,6,6,0],[21,30,6,6,0]]
};
// pre-render sprites to offscreen canvases (with a hit-flash variant)
function bake(rects,rot,flash){const c=document.createElement("canvas");c.width=c.height=16;const g=c.getContext("2d");
 for(const[x,y,w,h,col]of rects){g.fillStyle=flash?BG:(col?GREEN:DARK);
  let rx=x*PX,ry=y*PX,rw=w*PX,rh=h*PX;
  if(rot){[rx,ry,rw,rh]=[16-ry-rh,rx,rh,rw];} // rotate 90° clockwise → nose faces right
  g.fillRect(rx,ry,rw,rh);}
 return c;}
// rocks: 1 game px per cell. '#' dark outline/craters, 'g' green body, 'm' light rim
const ROCK={"small":["....#####.....","..##mmmgg##...",".#mmggggggg#..",".#mgg##gggggg#","#mgg##mgggggg#","#mggggmgggggg#","#mgggggggg##g#","#ggggggggg##m#","#gg#ggggggmmg#",".#g#mgggggggg#",".#ggggggggg##.","..##ggggg###..","....#####.....",".............."],"big":["........###.............","......##mmm##...........","......#mgggmm##.........",".....#mggggggmm##.......","....#mggggggggggg##.....","...#mgggggggggggggg##...","..#mggggggggg###mgggg#..",".#mgggggggggg###mgggg##.",".#mgggggggggg###mggggg##",".#mggggggggggmmmggggggg#",".#mggggggg#mgggggggggg##","..#mggggggmgggggggggggg#","..#mgggggggggggggggggg##","...#mg##mgggggggggggg##.","...#mg##mggggggggggg##..","...#ggmmggggggg##mggg#..","...#ggggggggggg##mgg#...","...#gggggggggggmmgg##...","...#gggggggggggggggg#...","...#ggggggggggg#g#g##...","....#ggggggggg#####.....",".....#g#ggg#g#..........","......###g###...........","........###............."]};
function bakeRock(rows,flash){const n=rows.length,c=document.createElement("canvas");c.width=c.height=n;const g=c.getContext("2d");
 rows.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch===".")return;
  g.fillStyle=flash?(ch==="#"?MID:BG):(ch==="#"?DARK:ch==="g"?GREEN:MID);g.fillRect(x,y,1,1);}));return c;}
const RK={small:bakeRock(ROCK.small),big:bakeRock(ROCK.big),smallf:bakeRock(ROCK.small,1),bigf:bakeRock(ROCK.big,1)};
const SP={ship:bake(S.ship,0),e1:bake(S.e1),e2:bake(S.e2),e3:bake(S.e3),e1f:bake(S.e1,0,1),e2f:bake(S.e2,0,1),e3f:bake(S.e3,0,1)};

const cv=document.getElementById("game"),ctx=cv.getContext("2d");
// Pick the field size, then size the canvas backing store to a whole multiple of it that matches the
// screen's device pixels, so every game pixel lands on whole device pixels (no blur on bars or text).
function fit(){
 if(state==="menu"||state==="over"){
  if(TOUCH.matches&&innerHeight>innerWidth){W=192;H=192;}
  else if(TOUCH.matches){W=256;H=144;}
  else{W=384;H=216;}
  document.documentElement.style.setProperty("--ar",W/H);}
 const css=cv.getBoundingClientRect().width||W,n=Math.max(1,Math.round(css*(devicePixelRatio||1)/W));
 if(cv.width!==W*n||cv.height!==H*n){cv.width=W*n;cv.height=H*n;}
 ctx.setTransform(n,0,0,n,0,0);ctx.imageSmoothingEnabled=false;}
const $=id=>document.getElementById(id);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let best=0;try{best=+localStorage.getItem("struggle-best")||0}catch(e){}
$("pauseHint").textContent=TOUCH.matches&&!matchMedia("(any-pointer:fine)").matches?"Press START":"Press P";
$("bestStart").textContent=best?"HI-SCORE "+String(best).padStart(6,"0"):"";

const keys={};
addEventListener("keydown",e=>{if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)&&state!=="menu")e.preventDefault();
 keys[e.code]=true;if(e.code==="KeyP"&&(state==="play"||state==="pause"))togglePause();});
addEventListener("keyup",e=>keys[e.code]=false);
addEventListener("blur",()=>{for(const k in keys)keys[k]=false;if(state==="play")togglePause();});
document.querySelectorAll(".pad [data-key]").forEach(el=>{const k=el.dataset.key;
 const on=e=>{e.preventDefault();el.setPointerCapture?.(e.pointerId);keys[k]=true;el.classList.add("on")};
 const off=()=>{keys[k]=false;el.classList.remove("on")};
 el.addEventListener("pointerdown",on);["pointerup","pointercancel","lostpointercapture"].forEach(t=>el.addEventListener(t,off));
 el.addEventListener("contextmenu",e=>e.preventDefault());});
function pressStart(){if(state==="menu"||state==="over")start();else togglePause();}
function exitGame(){state="menu";reset();$("start").hidden=false;$("over").hidden=true;$("paused").hidden=true;}
$("btnStart").addEventListener("click",pressStart);
$("btnExit").addEventListener("click",exitGame);
addEventListener("keydown",e=>{if(e.repeat)return;if(e.code==="Enter"&&state!=="menu"){e.preventDefault();pressStart();}if(e.code==="Escape")exitGame();});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

let state="menu",P,bullets,eb,enemies,parts,pickups,stars,score,t,spawnT,hold,wasFire,shake,level,rocks,rockT;
const ROCK_CYCLE=2400,ROCK_START=900,ROCK_LEN=600; // wave every 40s, lasts 10s
const rockWave=()=>{const c=t%ROCK_CYCLE;return c>=ROCK_START&&c<ROCK_START+ROCK_LEN;};
function reset(){
 fit();
 P={x:Math.min(30,W/8|0),y:(TOP+H)/2|0,w:16,h:16,hp:3,inv:0,cool:0};
 bullets=[];eb=[];enemies=[];parts=[];pickups=[];score=0;t=0;spawnT=1;hold=0;wasFire=false;shake=0;level=1;rocks=[];rockT=0;
 stars=Array.from({length:40},()=>({x:Math.random()*W,y:TOP+Math.random()*(H-TOP),s:Math.random()<.3?2:1}));
}
reset();

function start(){reset();state="play";$("start").hidden=true;$("over").hidden=true;cv.focus?.();}
$("startBtn").onclick=start;$("againBtn").onclick=start;
function togglePause(){state=state==="play"?"pause":"play";$("paused").hidden=state!=="pause";}

function spawn(){
 const r=Math.random(),y=TOP+8+Math.random()*(H-TOP-32),sp=1+level*.12;
 let e;
 if(level>=3&&r<.18) e={type:"e3",hp:6,spd:.35*sp,pts:300,fire:2};
 else if(level>=2&&r<.5) e={type:"e2",hp:2,spd:.9*sp,pts:150,fire:2.5,phase:Math.random()*6,amp:18+Math.random()*20};
 else e={type:"e1",hp:1,spd:1.1*sp,pts:50};
 Object.assign(e,{x:W+4,y,by:y,w:12,h:12,flash:0,ft:1+Math.random()*2});
 if(e.type==="e3"){e.w=14;e.h=14;}
 enemies.push(e);
}
function boom(x,y,n){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3,l:20+Math.random()*15});}
function hurt(){if(P.inv>0)return;P.hp--;P.inv=90;shake=reduce?0:8;boom(P.x+8,P.y+8,14);if(P.hp<=0)gameOver();}
function gameOver(){state="over";if(score>best){best=score;try{localStorage.setItem("struggle-best",best)}catch(e){}}
 $("finalScore").textContent="SCORE "+String(score).padStart(6,"0")+"  ·  HI "+String(best).padStart(6,"0");
 $("bestStart").textContent="HI-SCORE "+String(best).padStart(6,"0");$("over").hidden=false;$("againBtn").focus();}

const CHARGE=120; // frames = 2s at 60fps
function update(){
 t++;level=1+Math.floor(t/1200); // harder every 20 seconds
 const sp=2;
 if(keys.ArrowUp||keys.KeyW)P.y-=sp;if(keys.ArrowDown||keys.KeyS)P.y+=sp;
 if(keys.ArrowLeft||keys.KeyA)P.x-=sp;if(keys.ArrowRight||keys.KeyD)P.x+=sp;
 P.x=clamp(P.x,0,W-16);P.y=clamp(P.y,TOP,H-16);
 const fire=keys.Space||keys.KeyJ;
 if(P.cool>0)P.cool--;
 if(fire){hold++;if(!wasFire||P.cool===0&&hold<20){if(P.cool===0){bullets.push({x:P.x+15,y:P.y+10,w:6,h:2,vx:5,dmg:1});P.cool=10;}}}
 else if(wasFire){ if(hold>=CHARGE)bullets.push({x:P.x+14,y:P.y+3,w:18,h:16,vx:4,dmg:8,big:1,pierce:1}); hold=0;}
 wasFire=fire;
 if(P.inv>0)P.inv--;
 for(const s of stars){s.x-=s.s*.6;if(s.x<0){s.x=W;s.y=TOP+Math.random()*(H-TOP);}}
 const wave=rockWave();
 if(--spawnT<=0){spawn();spawnT=Math.max(18,90-level*8)*(.6+Math.random()*.8)*(wave?2.5:1);}
 if(wave&&--rockT<=0){rockT=40+Math.random()*40;
  const big=Math.random()<.4,s=big?24:14;
  rocks.push({x:W,y:TOP+4+Math.random()*(H-TOP-10-s),w:s,h:s,hp:big?16:8,pts:big?400:150,big,
   vx:.6+Math.random()*.8,vy:(Math.random()-.5)*.4,flash:0,fx:Math.random()<.5,fy:Math.random()<.5});}
 for(const r of rocks){r.x-=r.vx;r.y+=r.vy;if(r.y<TOP||r.y>H-r.h)r.vy*=-1;if(r.flash)r.flash--;
  for(const b of bullets)if(!b.dead&&hit(b,r)){r.hp-=b.dmg;r.flash=3;if(b.big)b.dmg-=4;else b.dead=1;if(b.dmg<=0)b.dead=1;}
  for(const b of eb)if(hit(b,r))b.dead=1;
  if(r.hp<=0){r.dead=1;score+=r.pts*level;boom(r.x+r.w/2,r.y+r.h/2,16);}
  else if(hit({x:P.x+3,y:P.y+3,w:10,h:10},r)){r.dead=1;boom(r.x+r.w/2,r.y+r.h/2,10);hurt();}}
 rocks=rocks.filter(r=>!r.dead&&r.x>-r.w);
 for(const b of bullets)b.x+=b.vx;bullets=bullets.filter(b=>b.x<W+20);
 for(const b of eb){b.x+=b.vx;b.y+=b.vy;}eb=eb.filter(b=>b.x>-8&&b.y>TOP-6&&b.y<H+8);
 for(const e of enemies){
  e.x-=e.spd;if(e.flash)e.flash--;
  if(e.type==="e2"){e.phase+=.05;e.y=clamp(e.by+Math.sin(e.phase)*e.amp,TOP+2,H-14);}
  if(e.type==="e3")e.y+=Math.sign(P.y-e.y)*.25;
  if(e.fire&&e.x<W-10&&(e.ft-=1/60)<=0){e.ft=e.fire/(1+level*.08);
   const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1,v=1.6;
   if(e.type==="e3")for(const a of[-.25,0,.25]){const c=Math.cos(a),s=Math.sin(a),vx=dx/d,vy=dy/d;eb.push({x:e.x,y:e.y+6,w:4,h:4,vx:(vx*c-vy*s)*v,vy:(vx*s+vy*c)*v});}
   else eb.push({x:e.x,y:e.y+5,w:3,h:3,vx:dx/d*v,vy:dy/d*v});}
  for(const b of bullets){if(!b.dead&&hit(b,e)){e.hp-=b.dmg;e.flash=4;if(!b.pierce)b.dead=1;else b.dmg-=1;if(b.dmg<=0)b.dead=1;}}
  if(e.hp<=0&&!e.dead){e.dead=1;score+=e.pts*level;boom(e.x+6,e.y+6,e.type==="e3"?20:8);
   if(Math.random()<.04&&P.hp<3)pickups.push({x:e.x,y:e.y,w:8,h:8});}
  if(!e.dead&&hit(P,e)){e.dead=1;boom(e.x+6,e.y+6,8);hurt();}
 }
 bullets=bullets.filter(b=>!b.dead);enemies=enemies.filter(e=>!e.dead&&e.x>-20);
 for(const b of eb)if(hit({x:P.x+3,y:P.y+3,w:10,h:10},b)){b.dead=1;hurt();}eb=eb.filter(b=>!b.dead);
 for(const p of pickups){p.x-=.8;if(hit(P,p)){p.dead=1;P.hp=Math.min(3,P.hp+1);}}pickups=pickups.filter(p=>!p.dead&&p.x>-10);
 for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.l--;}parts=parts.filter(p=>p.l>0);
 if(shake>0)shake--;
}

function hud(){
 ctx.fillStyle=BG;ctx.fillRect(0,0,W,TOP-2);ctx.fillStyle=MID;ctx.fillRect(0,TOP-2,W,1);
 // health frame (top of Health_Power_bar.svg): each 3-unit artwork pixel = 2 game px, so edges sit on the pixel grid
 const k=2/3,ox=2,oy=-2;const r=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(ox+x*k,oy+y*k,w*k,h*k)};
 r(9,9,30,3,DARK);r(6,12,3,15,DARK);r(39,12,3,15,DARK);r(9,27,30,3,DARK);
 [12,21,30].forEach((x,i)=>{r(x,15,6,9,i<P.hp?GREEN:MID)});
 // power bar (bottom of svg), fill grows with charge
 const ch=clamp(hold/CHARGE,0,1);
 r(6,36,3,9,DARK);r(33,36,3,9,DARK);r(36,39,3,6,DARK);r(9,42,24,3,DARK);r(39,42,3,3,DARK);r(9,36,24,6,MID);
 if(ch>0){ctx.fillStyle=ch>=1&&(t>>3)%2?DARK:GREEN;ctx.fillRect(ox+9*k,oy+36*k,Math.round(24*k*ch),6*k);}
 ctx.fillStyle=DARK;ctx.font="8px 'Press Start 2P', monospace";ctx.textBaseline="top";
 ctx.textAlign="left";ctx.fillText("LV"+level,36,8);
 ctx.textAlign="right";ctx.fillText("HI "+String(Math.max(best,score)).padStart(6,"0"),W-4,6);
 ctx.fillText(String(score).padStart(6,"0"),W-4,18);
}
// pixel fireball: rows of [offsetX, width] on a 2px grid, head on the right, no outline
const FIRE=[[6,3],[3,6],[1,8],[0,9],[1,8],[3,6],[6,3]];
const CORE=[[7,1],[5,3],[4,4],[5,3],[7,1]];
function fireball(b){const x=b.x|0,y=b.y|0,f=(t>>2)%2;
 ctx.fillStyle=GREEN;FIRE.forEach(([o,w],i)=>ctx.fillRect(x+o*2-(i%2?f*2:0),y+i*2,w*2,2));
 ctx.fillStyle=BG;CORE.forEach(([o,w],i)=>ctx.fillRect(x+o*2,y+2+i*2,w*2,2));
 ctx.fillStyle=MID;for(let i=0;i<4;i++){const ty=y+2+((t*3+i*5)%10),tx=x-4-i*4-((t+i)%3)*2;ctx.fillRect(tx,ty,2,2);}}
function draw(){
 ctx.save();ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
 if(shake)ctx.translate(Math.round((Math.random()-.5)*4),Math.round((Math.random()-.5)*4));
 ctx.fillStyle=MID;for(const s of stars)ctx.fillRect(s.x|0,s.y|0,s.s,1);
 for(const r of rocks){const img=RK[(r.big?"big":"small")+(r.flash?"f":"")],x=r.x|0,y=r.y|0,s=r.w;
  ctx.save();ctx.translate(x+(r.fx?s:0),y+(r.fy?s:0));ctx.scale(r.fx?-1:1,r.fy?-1:1);ctx.drawImage(img,0,0);ctx.restore();}
 for(const p of pickups){ctx.fillStyle=GREEN;ctx.fillRect(p.x|0,p.y+2|0,8,4);ctx.fillRect(p.x+2|0,p.y|0,4,8);}
 for(const e of enemies)ctx.drawImage(SP[e.type+(e.flash?"f":"")],e.x|0,(e.y|0)-2);
 for(const b of bullets){ctx.fillStyle=DARK;if(b.big)fireball(b);else ctx.fillRect(b.x|0,b.y|0,b.w,b.h);}
 ctx.fillStyle=DARK;for(const b of eb){ctx.fillRect(b.x|0,b.y|0,b.w,b.h);}
 if(state!=="over"&&!(P.inv&&(P.inv>>2)%2))ctx.drawImage(SP.ship,P.x|0,P.y|0);
 if(hold>20&&state==="play"){ctx.fillStyle=(t>>2)%2?GREEN:DARK;const s=2+Math.min(hold/CHARGE,1)*4;ctx.fillRect(P.x+16,P.y+11-s/2,s,s);}
 ctx.fillStyle=DARK;for(const p of parts)ctx.fillRect(p.x|0,p.y|0,2,2);
 ctx.restore();hud();
}
addEventListener("resize",fit);
let acc=0,last=performance.now();
function loop(now){acc+=Math.min(100,now-last);last=now;
 while(acc>=1000/60){if(state==="play")update();acc-=1000/60;}
 draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
</body>
